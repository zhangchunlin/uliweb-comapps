# UnQLite Database Configuration
#
# This module provides embedded NoSQL database functionality for Uliweb3 ASGI applications.
# UnQLite is a fast, lightweight, embedded NoSQL database engine.
#
# Usage:
#   from uliweb import functions
#   db = functions.get_unqlite()  # Get default database
#   db = functions.get_unqlite('mem')  # Get in-memory database

[FUNCTIONS]
# Register get_unqlite function for use via functions.get_unqlite()
# The register=True is optional for function-style calls
get_unqlite = 'uliweb_comapps.db.unq.get_unqlite'

[UNQLITE_DB_NAMES]
# Predefined UnQLite database configurations
# Use name as key to reference in get_unqlite(name='key')
default = './database.udb'
mem = ':mem:'
